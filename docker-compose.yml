services:
  tidyhouse:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - tidyhouse-data:/data
    environment:
      - DATABASE_URL=/data/tidyhouse.db
      - NODE_ENV=production
      - TIDYHOUSE_PASSWORD=${TIDYHOUSE_PASSWORD:-}
    restart: unless-stopped

volumes:
  tidyhouse-data:
