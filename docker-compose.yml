services:
  tidyhouse:
    image: ghcr.io/damhof/tidyhouse:latest
    # To build locally instead: comment out 'image' and uncomment 'build'
    # build: .
    ports:
      - "3000:3000"
    volumes:
      - tidyhouse-data:/data
    environment:
      - DATABASE_URL=/data/tidyhouse.db
      - NODE_ENV=production
      - TIDYHOUSE_PASSWORD=${TIDYHOUSE_PASSWORD:-}
    restart: unless-stopped

volumes:
  tidyhouse-data:
